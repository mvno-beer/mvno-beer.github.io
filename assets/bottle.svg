<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 600" width="200" height="600">
  <!-- MVNO BEER bottle, upright, without cap (cap.svg sits on top at x70-130, y28-58) -->
  <defs>
    <path id="glass" d="M78 60 L78 190 C78 240 20 252 20 322 L20 568 Q20 590 42 590 L158 590 Q180 590 180 568 L180 322 C180 252 122 240 122 190 L122 60 Z"/>
    <clipPath id="inside"><use href="#glass"/></clipPath>
    <linearGradient id="beer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C96A06"/>
      <stop offset=".35" stop-color="#F6B21E"/>
      <stop offset=".6" stop-color="#FFC93C"/>
      <stop offset="1" stop-color="#B85A04"/>
    </linearGradient>
    <linearGradient id="foam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F6E7C4"/>
    </linearGradient>
    <linearGradient id="neckGlass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9A5A14" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#E9B25B" stop-opacity=".25"/>
      <stop offset="1" stop-color="#7A4208" stop-opacity=".6"/>
    </linearGradient>
    <linearGradient id="roll" x1="0" y1="0" x2="1" y2="0">
      <stop offset=".1" stop-color="#000" stop-opacity=".35"/>
      <stop offset=".35" stop-color="#000" stop-opacity="0"/>
      <stop offset=".7" stop-color="#000" stop-opacity="0"/>
      <stop offset=".9" stop-color="#000" stop-opacity=".4"/>
    </linearGradient>
  </defs>

  <!-- glass tint -->
  <use href="#glass" fill="url(#neckGlass)"/>

  <g clip-path="url(#inside)">
    <!-- liquid -->
    <rect x="0" y="150" width="200" height="450" fill="url(#beer)"/>
    <!-- head of foam in neck -->
    <path d="M70 152 C80 140 90 146 100 140 C110 134 118 146 130 140 L130 172 C118 178 106 168 96 174 C86 180 78 170 70 174 Z" fill="url(#foam)"/>
    <!-- rising bubbles -->
    <g fill="#FFF3C4" fill-opacity=".85">
      <circle cx="60" cy="560" r="4"><animate attributeName="cy" values="580;200" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="140" cy="560" r="3"><animate attributeName="cy" values="580;220" dur="2.8s" begin="-1.2s" repeatCount="indefinite"/></circle>
      <circle cx="100" cy="560" r="5"><animate attributeName="cy" values="580;180" dur="4.1s" begin="-2s" repeatCount="indefinite"/></circle>
      <circle cx="82" cy="560" r="2.5"><animate attributeName="cy" values="580;190" dur="2.4s" begin="-.6s" repeatCount="indefinite"/></circle>
      <circle cx="120" cy="560" r="3.5"><animate attributeName="cy" values="580;210" dur="3.1s" begin="-2.6s" repeatCount="indefinite"/></circle>
      <circle cx="44" cy="560" r="2"><animate attributeName="cy" values="580;320" dur="2.6s" begin="-1.6s" repeatCount="indefinite"/></circle>
      <circle cx="160" cy="560" r="2.5"><animate attributeName="cy" values="580;330" dur="3.6s" begin="-.3s" repeatCount="indefinite"/></circle>
    </g>
    <!-- carbonation squiggle (from sketch) -->
    <path d="M36 300 C70 288 130 288 166 300" fill="none" stroke="#FFF6D6" stroke-width="4" stroke-linecap="round" stroke-opacity=".7"/>
    <g fill="none" stroke="#FFF6D6" stroke-width="4" stroke-opacity=".7">
      <circle cx="52" cy="306" r="6"/><circle cx="88" cy="300" r="6"/><circle cx="122" cy="300" r="6"/><circle cx="154" cy="306" r="5"/>
    </g>
    <!-- neck collar -->
    <rect x="70" y="96" width="60" height="34" fill="#283136"/>
    <path d="M70 102 L130 102 M70 124 L130 124" stroke="#F2C230" stroke-width="2"/>
    <!-- body label: wraps around, curved edges -->
    <path d="M10 356 Q100 376 190 356 L190 506 Q100 526 10 506 Z" fill="#283136"/>
    <path d="M10 366 Q100 386 190 366 M10 496 Q100 516 190 496" fill="none" stroke="#F2C230" stroke-width="2.5"/>
    <path d="M10 372 Q100 392 190 372 M10 490 Q100 510 190 490" fill="none" stroke="#F2C230" stroke-width="1" stroke-opacity=".6"/>
    <!-- barley emblem -->
    <circle cx="100" cy="440" r="36" fill="none" stroke="#F2C230" stroke-width="2"/>
    <circle cx="100" cy="440" r="31" fill="none" stroke="#F2C230" stroke-width="1" stroke-opacity=".5"/>
    <g fill="#F2C230">
      <path d="M100 414 L100 466" stroke="#F2C230" stroke-width="2" stroke-linecap="round"/>
      <ellipse cx="100" cy="416" rx="3.5" ry="7"/>
      <ellipse cx="94" cy="426" rx="3.5" ry="7" transform="rotate(-30 94 426)"/>
      <ellipse cx="106" cy="426" rx="3.5" ry="7" transform="rotate(30 106 426)"/>
      <ellipse cx="94" cy="438" rx="3.5" ry="7" transform="rotate(-30 94 438)"/>
      <ellipse cx="106" cy="438" rx="3.5" ry="7" transform="rotate(30 106 438)"/>
      <ellipse cx="94" cy="450" rx="3.5" ry="7" transform="rotate(-30 94 450)"/>
      <ellipse cx="106" cy="450" rx="3.5" ry="7" transform="rotate(30 106 450)"/>
      <circle cx="68" cy="440" r="2"/><circle cx="132" cy="440" r="2"/>
    </g>
    <!-- cylinder shading over labels -->
    <rect x="70" y="96" width="60" height="34" fill="url(#roll)"/>
    <path d="M10 356 Q100 376 190 356 L190 506 Q100 526 10 506 Z" fill="url(#roll)"/>
    <!-- highlights -->
    <rect x="34" y="330" width="12" height="230" rx="6" fill="#FFFFFF" fill-opacity=".35"/>
    <rect x="86" y="70" width="6" height="140" rx="3" fill="#FFFFFF" fill-opacity=".45"/>
    <rect x="160" y="340" width="6" height="200" rx="3" fill="#FFFFFF" fill-opacity=".18"/>
  </g>

  <!-- outline -->
  <use href="#glass" fill="none" stroke="#7A4208" stroke-opacity=".5" stroke-width="2"/>
  <!-- lip -->
  <rect x="72" y="42" width="56" height="22" rx="6" fill="#C9A06A" stroke="#7A4208" stroke-opacity=".5" stroke-width="2"/>
</svg>
